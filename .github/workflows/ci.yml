name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versao do compilador
        run: g++ --version

      - name: Testes com AddressSanitizer + UBSan
        run: make test SANITIZE=1

      - name: Limpar
        run: make clean

      - name: Demo
        run: make run
